name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan (tracked files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on tracked credential artifacts
        run: |
          set -e
          status=0
          # 数据库/WAL 文件绝不能进仓库（含真实账号与 token）
          if git ls-files | grep -E '(^|/)[^/]*\.db(-wal|-shm)?$'; then
            echo "::error::发现被跟踪的 SQLite 数据库文件"
            status=1
          fi
          # 示例代码里不得出现真实 xsec_token
          if git grep -nE 'xsec_token=[A-Za-z0-9_-]{16,}' -- . ':!docs' ':!tests'; then
            echo "::error::发现疑似真实 xsec_token"
            status=1
          fi
          exit $status

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          ENVIRONMENT: test
        # xdist 并行：拆分后的测试文件互不共享状态（见 tests/backend/conftest.py）
        run: python -m pytest -q -n auto

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Node integration tests
        run: npm run test:node

      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke (playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t spider-xhs:ci .
