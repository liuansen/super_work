[pytest]
# 只收集本工程 tests/ 目录；vendor 上游快照与本地产物不参与收集。
testpaths = tests
norecursedirs = vendor .local node_modules frontend static spider author apis xhs_utils
# review P2：裸 `pytest` 时把项目根加入 sys.path，否则 `from backend.app...`
# 与 `from xhs_utils...` 会 ModuleNotFoundError（此前必须 `python -m pytest`）
pythonpath = .
